<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DNO share card</title>
<!-- The share card (W2-2): rendered once by render.mjs, served as assets/dno-share.jpg. It carries no live value:
     platforms cache cards for days, so a status, a count or a date would go stale. The words are the site header's. -->
<style>
@font-face { font-family: "Geist"; src: url("../../assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url("../../assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
html, body { margin: 0; background: #03060b; }
.card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #03060b; color: #F3F3F3; font-family: "Geist", sans-serif; }
.art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 40%; }
.shade { position: absolute; inset: 0; background: linear-gradient(90deg, #03060b 0%, rgba(3, 6, 11, .94) 36%, rgba(3, 6, 11, .55) 62%, rgba(3, 6, 11, .15) 100%); }
.body { position: absolute; left: 80px; top: 84px; bottom: 72px; width: 640px; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 28px; }
.mark { width: 148px; height: 148px; mix-blend-mode: lighten; } /* the mark's black ground takes the card's, so no square shows */
.name b { display: block; font: 600 104px/1 "Geist", sans-serif; letter-spacing: 0.04em; }
.name span { display: block; margin-top: 14px; font: 400 38px/1.1 "Geist", sans-serif; color: #E8E8E8; }
.line { margin-top: 64px; padding-left: 22px; border-left: 2px solid #223249; font: 400 30px/1.4 "Geist", sans-serif; color: #C8C8C8; }
.host { margin-top: auto; font: 400 26px/1 "Geist Mono", monospace; color: #8FB8FF; letter-spacing: 0.02em; }
.touch { width: 180px; height: 180px; background: #000; display: grid; place-items: center; }
.touch img { width: 168px; height: 168px; }
</style>
</head>
<body>
<div class="card" id="card">
  <img class="art" src="../../assets/dno-planet.jpg" alt="">
  <div class="shade"></div>
  <div class="body">
    <div class="brand"><img class="mark" src="../../assets/dno-mark.jpg" alt=""><div class="name"><b>DNO</b><span>Demos Network Oracle</span></div></div>
    <p class="line">Independent observability ·<br>not an official Demos product.</p>
    <p class="host">demos-oracle.com</p>
  </div>
</div>
<div class="touch" id="touch"><img src="../../assets/dno-mark.jpg" alt=""></div>
</body>
</html>
